name: Build 多功能写作

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          curl -L -o /opt/theos/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
          chmod +x /opt/theos/bin/ldid

      - name: Build
        run: |
          export THEOS=/opt/theos
          make clean 2>/dev/null || true
          make package 2>&1 || true
          # Copy dylib to workspace root for upload
          find . -name "多功能写作.dylib" -exec cp {} ./ \;
          echo "=== Output files ==="
          find . -name "*.deb" -o -name "*.dylib" | head -20
          ls -lh *.dylib 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 多功能写作
          path: |
            *.dylib
            packages/*.deb
          if-no-files-found: error